<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="12" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0"/>
  <feComponentTransfer><feFuncR type="linear" slope=".28" intercept=".32"/><feFuncG type="linear" slope=".28" intercept=".32"/><feFuncB type="linear" slope=".28" intercept=".32"/><feFuncA type="linear" slope=".28"/></feComponentTransfer>
 </filter>
 <rect width="160" height="160" fill="#ffffff" filter="url(#grain)"/>
</svg>